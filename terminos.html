    // Listener global para capturar todos los clics a WhatsApp
    document.addEventListener('click', function(e) {
      var target = e.target.closest('a, button');
      if (!target) return;
      var href = target.getAttribute('href') || '';
      var hasWa = target.hasAttribute('data-wa-msg');
      var aria = (target.getAttribute('aria-label') || '').toLowerCase();
      var txt = (target.innerText || '').toLowerCase();
      if (hasWa || href.indexOf('wa.me') !== -1 || href.indexOf('whatsapp.com') !== -1 || aria.indexOf('whatsapp') !== -1 || txt.indexOf('whatsapp') !== -1) {
        if (typeof window.fbq === 'function') {
          window.fbq('track', 'Contact', { content_name: 'WhatsApp Click' });
          window.fbq('trackCustom', 'Whatsapp', { content_name: 'WhatsApp Click' });
        }
      }
    }, true);
  </script>
